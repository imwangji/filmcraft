[package]
name = "filmcraft-face-analysis"
description = "Offline face landmarks for independently tracked portrait effects"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = []
mediapipe = ["dep:tract-tflite", "dep:sha2"]

[dependencies]
thiserror.workspace = true
tract-tflite = { version = "=0.23.9", optional = true }
sha2 = { version = "0.10", optional = true }

[dev-dependencies]
image = { version = '0.25', default-features = false, features = ['jpeg', 'png'] }
